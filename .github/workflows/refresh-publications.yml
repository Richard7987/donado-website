name: Refresh publications

# Weekly: re-read the publication list from ORCID and, if it changed, commit the
# new papers.bib and trigger a deploy.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node bin/fetch_publications.mjs --limit 0
      - name: Commit and deploy if changed
        run: |
          if git diff --quiet -- _bibliography/papers.bib; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Refresh publications from ORCID"
          git push
          gh workflow run "Deploy site" --ref "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
